services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: base 
      args:
        USER_ID: ${UID:-1000}
        GROUP_ID: ${GID:-1000}
    container_name: imageto3d_dev
    image: imageto3d-dev
    volumes:
      - .:/app:rw
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    environment:
      - DISPLAY=${DISPLAY}
      # NVIDIA_VISIBLE_DEVICES i DRIVER_CAPABILITIES są potrzebne dla obrazów nvidia/cuda
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    tty: true
    stdin_open: true
